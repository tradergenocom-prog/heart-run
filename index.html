async function sendLink(event){event.preventDefault();if(online.busy)return;const form=event.currentTarget;if(!form.reportValidity())return;const name=document.getElementById('player-name').value.trim(),email=document.getElementById('player-email').value.trim();if(name.length<2){onlineStatus(text('กรุณาใส่ชื่อเล่นอย่างน้อย 2 ตัวอักษร','Nickname needs at least 2 characters'),true);return}online.busy=true;primary.disabled=true;
 try{const bytes=crypto.getRandomValues(new Uint8Array(32)),encode=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');const verifier=encode(bytes),challenge=encode(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)));storageSet(localStorage,flowKey,{verifier,name,at:Date.now()});await api('/auth/v1/otp?redirect_to='+encodeURIComponent(ONLINE_CONFIG.redirectUrl),{email,create_user:true,code_challenge:challenge,code_challenge_method:'s256'});onlineStatus(text('ส่งคำขอแล้ว กรุณาเปิดลิงก์ในอีเมลด้วยเบราว์เซอร์และอุปกรณ์นี้ หากไม่พบให้ตรวจจดหมายขยะ','Request sent. Open the email link in this browser on this device. Check spam if needed.'));primary.textContent=text('ส่งลิงก์อีกครั้ง','SEND AGAIN')}

async function updateRankings(view){if(online.busy)return;online.busy=true;primary.disabled=true;const result=online.result;try{if(!online.saved){onlineStatus(text('กำลังบันทึกคะแนน…','Saving score…'));await rpc('heart_finish_run',{p_run:result.run,p_score:result.score,p_elapsed:result.elapsed,p_outcome:result.outcome});online.saved=true}const rows=await rpc('heart_top10');if(online.result!==result||!['win','lose'].includes(screen))return;const tbody=document.querySelector('#ranking-table tbody');tbody.replaceChildren();for(const item of rows){const row=document.createElement('tr');if(item.is_me)row.className='is-me';for(const value of [item.rank,item.display_name,Number(item.score).toLocaleString()]){const td=document.createElement('td');td.textContent=String(value);row.append(td)}tbody.append(row)}onlineStatus(rows.length?text('บันทึกแล้ว • เรียงคะแนนสูงสุดก่อน','Saved • Highest scores first'):text('ยังไม่มีคะแนน','No scores yet'))}
 catch{if(online.result===result&&['win','lose'].includes(screen))onlineStatus(online.saved?text('บันทึกคะแนนแล้ว แต่โหลดอันดับไม่สำเร็จ กดลองใหม่','Score saved; rankings unavailable. Retry.'):text('ยังบันทึกคะแนนไม่สำเร็จ กดลองใหม่ก่อนเริ่มรอบถัดไป','Score not saved. Retry before starting another run.'),true)}finally{online.busy=false;if(['win','lose'].includes(screen))primary.disabled=!online.saved;else primary.disabled=false}}

function sync(){document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));document.getElementById('th').classList.toggle('active',lang==='th');document.getElementById('en').classList.toggle('active',lang==='en');document.documentElement.lang=lang;foot.textContent=screen==='playing'?t('demo'):''}function show(s){if(s==='login'){loginScreen();return}if(!online.ready){loginScreen();return}online.view++;primary.disabled=false;clearPointer();overlay.dataset.scene=s;screen=s;pauseButton.hidden=true;overlay.classList.remove('hidden');hud.classList.remove('on');secondary.style.display='none';document.getElementById('subtitle').textContent='Save Your Heart!';const mascot=document.querySelector('.mascot'),logo=document.querySelector('.logo');mascot.textContent='❤️';logo.textContent='HEART RUN';logo.style.fontSize='';if(s==='welcome'){content.innerHTML=`<p><b>${t('welcome')}</b></p><p>${t('intro')}</p>`;primary.textContent=t('play');secondary.textContent=t('how');secondary.style.display='block';primary.onclick=startOnline;secondary.onclick=()=>show('how')}else if(s==='how'){content.innerHTML=`<p>${t('rules')}</p>`;primary.textContent=t('ready');primary.onclick=startOnline;secondary.textContent=t('back');secondary.style.display='block';secondary.onclick=()=>show('welcome')}else if(s==='paused'){logo.textContent=lang==='th'?'พักหัวใจสักครู่':'TAKE A BREATHER';logo.style.fontSize='28px';content.innerHTML='<p>'+(lang==='th'?'พร้อมแล้วค่อยไปต่อ เวลาในเกมหยุดอยู่':'Your timer is paused. Continue when ready.')+'</p>';primary.textContent=lang==='th'?'เล่นต่อ':'RESUME';primary.onclick=resume;secondary.style.display='block';secondary.textContent=t('home');secondary.onclick=()=>show('welcome')}else{const won=s==='win';mascot.textContent=won?'💖':'💔';logo.textContent=won?t('win'):t('lose');logo.style.fontSize='31px';content.innerHTML=`<div class="tiny">${t('score')}</div><div class="result-score">${state.score.toLocaleString()}</div><p>COMBO MAX ×${Math.min(4,1+Math.floor(Math.max(0,state.bestCombo-1)/5))}</p><p class="tiny">${t('tip')}</p>`;primary.textContent=t('again');primary.onclick=startOnline;secondary.textContent=t('home');secondary.style.display='block';secondary.onclick=()=>show('welcome')}document.getElementById('notice').textContent=t('demo');sync();paintMascot(s);if(s==='win'||s==='lose'){if(!online.result)online.result={run:online.run,score:state.score,elapsed:Math.min(60,state.elapsed),outcome:s};resultPanel();updateRankings(online.view)}else{const status=document.createElement('p');status.id='online-status';status.setAttribute('role','status');content.append(status)}addAccountControls()}
function start(){state={score:0,combo:0,bestCombo:0,lives:CONFIG.lives,time:CONFIG.duration,elapsed:0,heartX:180,targetX:180,objects:[],spawn:0,clouds:Array.from({length:10},(_,i)=>({x:20+Math.random()*320,y:i*75-40,r:15+Math.random()*23,speed:12+Math.random()*16})),invuln:0,particles:[],difficulty:0,medicine:0,nextMedicine:CONFIG.medicineFirstAt,countdown:3,popups:[],shake:0,pickup:0,safeLane:2};clearPointer();screen='playing';pauseButton.hidden=false;overlay.classList.add('hidden');hud.classList.add('on');foot.textContent=t('demo');updateHud();last=performance.now();if(!raf)raf=requestAnimationFrame(frame)}function updateHud(){document.getElementById('score').textContent=state.score.toLocaleString();document.getElementById('combo').textContent='×'+Math.min(4,1+Math.floor(Math.max(0,state.combo-1)/5));document.getElementById('lives').textContent='♥'.repeat(state.lives)+'♡'.repeat(3-state.lives);document.getElementById('time').textContent=Math.ceil(state.time)}function heart(x,y,r){ctx.save();ctx.translate(x,y);ctx.scale(r/27,r/27*.88);ctx.shadowColor='#d93c6880';ctx.shadowBlur=12;ctx.shadowOffsetY=6;ctx.beginPath();ctx.moveTo(0,22);ctx.bezierCurveTo(-9,15,-28,0,-26,-13);ctx.bezierCurveTo(-23,-30,-7,-31,0,-19);ctx.bezierCurveTo(7,-31,23,-30,26,-13);ctx.bezierCurveTo(28,0,9,15,0,22);const g=ctx.createLinearGradient(-20,-25,17,20);g.addColorStop(0,'#ff9cb0');g.addColorStop(.45,'#ff4c73');g.addColorStop(1,'#d91c56');ctx.fillStyle=g;ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffffff99';ctx.beginPath();ctx.ellipse(-13,-18,7,3,-.6,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-8,-7,4,5,0,0,7);ctx.ellipse(8,-7,4,5,0,0,7);ctx.fill();ctx.fillStyle='#54243b';ctx.beginPath();ctx.arc(-7,-6,2,0,7);ctx.arc(9,-6,2,0,7);ctx.fill();ctx.strokeStyle='#842342';ctx.lineWidth=2;ctx.beginPath();ctx.arc(1,2,6,.15,Math.PI-.15);ctx.stroke();ctx.restore()}
function bg(dt){const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#d7f7ff');grad.addColorStop(.45,'#ffe5f1');grad.addColorStop(1,'#ffc4dc');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);const phase=state?state.elapsed:performance.now()/1000;ctx.fillStyle='#ffffff55';for(let i=0;i<9;i++){const x=20+(i*79)%320,y=(i*83+phase*(5+i%3))%700-30;ctx.save();ctx.translate(x,y);ctx.scale(.38,.38);ctx.beginPath();ctx.moveTo(0,12);ctx.bezierCurveTo(-30,-4,-14,-24,0,-10);ctx.bezierCurveTo(14,-24,30,-4,0,12);ctx.fill();ctx.restore()}ctx.strokeStyle='#ffffff65';ctx.lineWidth=14;for(let i=0;i<4;i++){ctx.beginPath();const x=i*120-40;ctx.moveTo(x,-20);for(let y=0;y<H+30;y+=20)ctx.lineTo(x+Math.sin(y/95+i*1.8+phase*.3)*25,y);ctx.stroke()}const clouds=state?state.clouds:[{x:60,y:130,r:28},{x:290,y:260,r:36},{x:110,y:490,r:24}];clouds.forEach(c=>{ctx.fillStyle='#ffffffa8';ctx.beginPath();ctx.ellipse(c.x,c.y,c.r*1.5,c.r*.58,0,0,Math.PI*2);ctx.ellipse(c.x-c.r*.5,c.y-8,c.r*.65,c.r*.65,0,0,Math.PI*2);ctx.ellipse(c.x+c.r*.3,c.y-12,c.r*.75,c.r*.7,0,0,Math.PI*2);ctx.fill();if(state){c.y+=c.speed*dt;if(c.y>H+60){c.y=-60;c.x=20+Math.random()*320}}})}function drawItem(o){ctx.save();ctx.translate(o.x,o.y);if(o.type==='cell')ctx.rotate(Math.sin((state?state.elapsed:0)*3+o.x)*.18);ctx.shadowColor='#7e3b6240';ctx.shadowBlur=9;ctx.shadowOffsetY=3;if(o.type==='medicine'){ctx.rotate(-.5);ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(-20,-11,40,22,11);ctx.fill();ctx.fillStyle='#51bea9';ctx.beginPath();ctx.roundRect(-20,-11,20,22,[11,0,0,11]);ctx.fill();ctx.strokeStyle='#318f83';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-20,-11,40,22,11);ctx.stroke();ctx.fillStyle='#318f83';ctx.fillRect(7,-6,3,12);ctx.fillRect(3,-2,11,3)}else if(o.type==='cell'){ctx.fillStyle='#e32d5b';ctx.beginPath();ctx.ellipse(0,0,17,13,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#a9184b';ctx.beginPath();ctx.ellipse(0,0,8,5,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffb0c1';ctx.lineWidth=3;ctx.beginPath();ctx.arc(-2,-2,10,Math.PI*1.1,Math.PI*1.8);ctx.stroke()}else{ctx.shadowBlur=0;ctx.lineWidth=2;ctx.strokeStyle='#875071';
 if(o.type==='cig'){ctx.rotate(-.3);ctx.fillStyle='#fff9ef';ctx.fillRect(-23,-8,34,16);ctx.fillStyle='#d99956';ctx.fillRect(11,-8,13,16);ctx.fillStyle='#f06e69';ctx.fillRect(-25,-8,5,16);ctx.strokeStyle='#b7a9b5';ctx.beginPath();ctx.moveTo(-23,-12);ctx.bezierCurveTo(-37,-20,-11,-22,-24,-34);ctx.stroke()}
 else if(o.type==='salt'){ctx.fillStyle='#f8d16a';for(let i=0;i<5;i++){ctx.fillRect(-18+i*7,-25+(i%2)*4,5,28)}ctx.fillStyle='#e86683';ctx.beginPath();ctx.moveTo(-23,-8);ctx.lineTo(23,-8);ctx.lineTo(17,23);ctx.lineTo(-17,23);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText('Na+',0,12)}
 else{ctx.fillStyle=o.type==='ldl'?'#af83de':'#77b7d4';for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.arc(Math.cos(a)*19,Math.sin(a)*19,5,0,7);ctx.fill()}ctx.beginPath();ctx.arc(0,0,21,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText(o.type==='ldl'?'LDL':'BP ↑',0,-8);ctx.fillStyle='#593951';for(const x of [-7,7]){ctx.beginPath();ctx.arc(x,2,3,0,7);ctx.fill()}ctx.strokeStyle='#593951';ctx.beginPath();ctx.arc(0,15,6,Math.PI,2*Math.PI);ctx.stroke()}}
ctx.restore()}
function spawn(){
 const s=state,p=CONFIG.phases[Math.min(2,Math.floor(s.elapsed/20))],lanes=[44,112,180,248,316];
 // A continuous corridor: each new safe lane is at most one lane from the last.
 const safe=Math.max(0,Math.min(4,s.safeLane+Math.floor(Math.random()*3)-1));s.safeLane=safe;
 const candidates=[0,1,2,3,4].filter(i=>i!==safe&&i!==Math.max(0,safe-1));
 for(let i=candidates.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[candidates[i],candidates[j]]=[candidates[j],candidates[i]]}
 const speed=p.speed+Math.random()*8;
 for(const lane of candidates.slice(0,p.hazards))s.objects.push({x:lanes[lane],y:-35,type:['cig','salt','ldl','pressure'][Math.floor(Math.random()*4)],r:20,speed,hit:false});
 const medicine=s.elapsed>=s.nextMedicine;if(medicine)s.nextMedicine=s.elapsed+CONFIG.medicineInterval;s.objects.push({x:lanes[safe],y:-35,type:medicine?'medicine':'cell',r:16,speed,hit:false});
 s.spawn=p.interval;
}
function burst(x,y,color){for(let i=0;i<9&&state.particles.length<CONFIG.particleLimit;i++){const a=Math.random()*Math.PI*2,v=35+Math.random()*80;state.particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.5,color})}}function frame(now){
 raf=0;const dt=Math.min(.05,Math.max(0,(now-last)/1000||0));last=now;
 if(screen==='playing'){
 const s=state;s.countdown=Math.max(0,s.countdown-dt);
 if(s.countdown===0){
 const step=Math.min(dt,Math.max(0,CONFIG.duration-s.elapsed));s.elapsed+=step;s.time=Math.max(0,CONFIG.duration-s.elapsed);
 s.invuln=Math.max(0,s.invuln-step);s.medicine=Math.max(0,s.medicine-step);s.pickup=Math.max(0,s.pickup-step);s.shake=Math.max(0,s.shake-step);
 const movement=(s.targetX-s.heartX)*(1-Math.exp(-CONFIG.responsiveness*step));s.heartX+=Math.max(-CONFIG.maxMoveSpeed*step,Math.min(CONFIG.maxMoveSpeed*step,movement));
 s.spawn-=step;if(s.spawn<=0)spawn();
 for(const o of s.objects){o.speed=CONFIG.phases[Math.min(2,Math.floor(s.elapsed/20))].speed;o.y+=o.speed*step;if(!o.hit&&Math.hypot(o.x-s.heartX,o.y-500)<o.r+19){
 if(o.type==='medicine'){o.hit=true;s.medicine=CONFIG.medicineDuration;s.popups.push({x:o.x,y:o.y,text:lang==='th'?'ทะลุอุปสรรค!':'PHASE SHIELD!',life:.9});burst(o.x,o.y,'#50cdb4')}else if(o.type==='cell'){o.hit=true;s.combo++;s.bestCombo=Math.max(s.bestCombo,s.combo);const points=10*Math.min(4,1+Math.floor((s.combo-1)/5));s.score+=points;s.pickup=.22;s.popups.push({x:o.x,y:o.y,text:'+'+points,life:.7});burst(o.x,o.y,'#f54a7d')}
 else if(s.medicine>0){o.hit=true;burst(o.x,o.y,'#76e4d4')}else if(s.invuln<=0){o.hit=true;s.lives--;s.combo=0;s.invuln=CONFIG.invulnerability;s.shake=.22;burst(s.heartX,500,'#ffb433');if(s.lives===0)break}
 }}
 s.objects=s.objects.filter(o=>!o.hit&&o.y<H+45);
 for(const p of s.particles){p.x+=p.vx*step;p.y+=p.vy*step;p.life-=step}s.particles=s.particles.filter(p=>p.life>0);
 for(const p of s.popups){p.y-=45*step;p.life-=step}s.popups=s.popups.filter(p=>p.life>0);
 updateHud();if(s.lives<=0)show('lose');else if(s.time<=0)show('win');
 }
 }
 bg(screen==='playing'?dt:0);
 if(screen==='playing'){
 const s=state;ctx.save();if(s.shake>0)ctx.translate(Math.sin(now*.09)*3,Math.cos(now*.07)*2);
 for(const o of s.objects)drawItem(o);
 for(const p of s.particles){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill()}ctx.globalAlpha=1;
 if(s.medicine>0){ctx.strokeStyle='#42bba8';ctx.fillStyle='#a5f4dd44';ctx.lineWidth=3;ctx.beginPath();ctx.arc(s.heartX,497,36,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(s.heartX,497,36,-Math.PI/2,-Math.PI/2+Math.PI*2*s.medicine/CONFIG.medicineDuration);ctx.stroke();ctx.fillStyle='#237c70';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText((lang==='th'?'ทะลุ ':'SHIELD ')+s.medicine.toFixed(1)+'s',s.heartX,548)}if(s.medicine>0||s.invuln===0||Math.floor(s.invuln*12)%2===0)heart(s.heartX,500+Math.sin(now*.006)*2,28+(s.pickup>0?3:0));
 ctx.textAlign='center';ctx.font='bold 20px system-ui';for(const p of s.popups){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle='#ad2453';ctx.fillText(p.text,p.x,p.y)}ctx.globalAlpha=1;ctx.restore();
 ctx.fillStyle='#ffffffc9';ctx.beginPath();ctx.roundRect(12,H-79,W-24,57,24);ctx.fill();ctx.fillStyle='#944365';ctx.font='bold 12px system-ui';ctx.textAlign='center';
 const phase=Math.min(3,1+Math.floor(s.elapsed/20));ctx.fillText((lang==='th'?'ระดับ ':'PHASE ')+phase+' / 3  ·  COMBO ×'+Math.min(4,1+Math.floor(Math.max(0,s.combo-1)/5)),W/2,H-56);
 ctx.font='11px system-ui';ctx.fillText(lang==='th'?'ลากซ้าย–ขวา • หลบอุปสรรค เก็บเม็ดเลือดแดง':'Drag to dodge hazards and collect blood cells',W/2,H-37);
 if(s.countdown>0){ctx.fillStyle='#fff9';ctx.fillRect(0,90,W,470);ctx.fillStyle='#e73d6c';ctx.font='900 90px system-ui';ctx.fillText(Math.ceil(s.countdown),180,340)}
 else if(s.time<=10){ctx.fillStyle='#c7295b';ctx.font='bold 26px system-ui';ctx.fillText(Math.ceil(s.time),180,125)}
 }
 if(screen==='playing')raf=requestAnimationFrame(frame);
}
function paintMascot(scene){const host=document.querySelector('.mascot');host.textContent='';const c=document.createElement('canvas');c.width=100;c.height=100;host.appendChild(c);const m=c.getContext('2d');m.drawImage(makeMascot(scene),0,0);}
function makeMascot(scene){const c=document.createElement('canvas');c.width=100;c.height=100;const m=c.getContext('2d');m.translate(0,5);m.scale(1,.9);m.fillStyle=scene==='lose'?'#e781a0':'#f44e7e';m.beginPath();m.moveTo(50,85);m.bezierCurveTo(-12,48,10,-5,50,25);m.bezierCurveTo(90,-5,112,48,50,85);m.fill();m.fillStyle='#fff8';m.beginPath();m.ellipse(28,25,9,4,-.5,0,7);m.fill();m.fillStyle='#602c49';for(const x of [36,64]){m.beginPath();m.ellipse(x,43,3,5,0,0,7);m.fill()}m.strokeStyle='#602c49';m.lineWidth=3;m.beginPath();if(scene==='lose')m.arc(50,65,7,Math.PI,Math.PI*2);else m.arc(50,53,8,0,Math.PI);m.stroke();return c;}
function clearPointer(){if(activePointer!==null&&canvas.hasPointerCapture(activePointer))canvas.releasePointerCapture(activePointer);activePointer=null;pointerDown=false;}
function pause(){if(screen!=='playing')return;if(raf)cancelAnimationFrame(raf);raf=0;show('paused');}
function resume(){if(screen!=='paused')return;clearPointer();screen='playing';overlay.classList.add('hidden');hud.classList.add('on');pauseButton.hidden=false;last=performance.now();sync();if(!raf)raf=requestAnimationFrame(frame);}
pauseButton.onclick=pause;document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(screen==='playing')pause();else if(screen==='paused')resume()}});
function move(e){if(!pointerDown||screen!=='playing'||e.pointerId!==activePointer)return;const r=canvas.getBoundingClientRect();state.targetX=Math.max(28,Math.min(W-28,dragTarget+(e.clientX-dragX)/r.width*W));e.preventDefault()}
canvas.addEventListener('pointerdown',e=>{if(screen!=='playing'||activePointer!==null||e.button!==0)return;activePointer=e.pointerId;pointerDown=true;dragX=e.clientX;dragTarget=state.targetX;canvas.setPointerCapture(e.pointerId);e.preventDefault()});canvas.addEventListener('pointermove',move);for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,e=>{if(e.pointerId===activePointer)clearPointer()});
document.getElementById('th').onclick=()=>{lang='th';if(screen!=='playing')show(screen);else{sync();updateHud()}};document.getElementById('en').onclick=()=>{lang='en';if(screen!=='playing')show(screen);else{sync();updateHud()}};document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('blur',()=>{if(screen==='playing')pause()});bootstrapOnline().catch(()=>loginScreen(text('เบราว์เซอร์ไม่อนุญาตให้จัดเก็บข้อมูล กรุณาอนุญาตแล้วโหลดใหม่','Browser storage unavailable. Enable storage and reload.')));ctx.fillStyle='#ffe0eb';ctx.fillRect(0,0,W,H);
})();
